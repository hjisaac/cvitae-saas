    organization_url: "https://instadeep.com/"
    title: !t "Apprentice Research Engineer"
    dates: !t "Jul 2025 -- Now"
    location: !t "South Africa, hybrid"
    details:
      - !t "Evaluated fine-tuning strategies for adapting InstaNovo, a transformer-based de novo peptide sequencing model, to glycopeptide sequencing tasks."
      - !t "Explored contrastive learning, multi-task learning, knowledge distillation, curriculum learning, and transformer-variant architectures to improve sequencing performance."
      - !t "Designed modular, pluggable components inspired by research papers to accelerate hypothesis testing and integration of new modeling approaches."
      - !t "Conducted large-scale experiments and ablation studies on architectural choices, training strategies, and model components."
      - !t "Designed synthetic glycopeptide datasets and multi-stage training strategies to improve representation learning and transfer to experimental tasks."
      - !t "Performed glycopeptide spectral dataset analysis and feature selection studies to understand data characteristics and model limitations."
      - !t "Documented research findings through technical reports, visualizations, and presentations."

